name: Release npm Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit
          else
            npm install --no-audit
          fi

      - name: Build web console
        run: npm run build

      - name: Create npm package tarball and compute checksums
        id: package
        run: |
          TARBALL=$(npm pack)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "Generated package: $TARBALL"

          # Generate standard SHA-256 checksums file
          sha256sum "$TARBALL" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.tag_name || 'v1.0.0' }}
          files: |
            ${{ steps.package.outputs.tarball }}
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to npm (optional if NPM_TOKEN secret exists)
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
